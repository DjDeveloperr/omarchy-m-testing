# Every Apple Silicon Mac the site tracks, grouped as people buy them, for the
# bring-up table on /models (MacLineup). Boards come from the Asahi feature
# tables' columns (catalogue/asahi_tables.py MODEL_COLUMNS); chip is the
# catalogue's chip generation key.
#
# gpu and display are the bring-up state of the Omarchy default image on that
# Mac: status works, pending or missing, with a short note (and optionally a
# url, e.g. the pull request it waits on). Leave one out and the catalogue's
# expected Asahi and Aurora states decide it. Test results on /models come
# from the reports, never from here.
