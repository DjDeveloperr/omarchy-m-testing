name: CI

on:
  push:
  pull_request:

jobs:
  cli:
    name: CLI (Seam A)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Host boundary and stdlib-only imports
        run: python cli/scripts/check_boundary.py
      - name: Seam A tests
        working-directory: cli
        run: python -m unittest discover -s tests -t . -v

  gpu-native:
    name: GPU helper compile and CPU-only guards
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies (CI only)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libvulkan-dev glslang-tools spirv-tools
      - name: Compile C and validate SPIR-V; no GPU invocation
        run: |
          cli/scripts/build_gpu_benchmark.sh "$RUNNER_TEMP/gpu-helper"
          "$RUNNER_TEMP/gpu-helper/gpu-benchmark-vulkan" --host-self-test
      - name: Preserve compile-only helper receipt
        uses: actions/upload-artifact@v4
        with:
          name: gpu-helper-${{ matrix.os }}
          path: ${{ runner.temp }}/gpu-helper/

  installer:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, upgrade in place, refuse tampered and foreign-signed releases
        run: installer/test.sh
      - name: The release tarball ships the catalogue and the vendored check scripts
        run: release/check.sh

  catalogue:
    name: Feature catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Asahi layer matches the pinned snapshot of Asahi's tables
        run: python catalogue/asahi_tables.py check

  schema:
    name: Report schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install check-jsonschema==0.33.0
      - name: Schema is valid draft 2020-12
        run: check-jsonschema --check-metaschema schema/*.schema.json
      - name: Golden reports validate
        run: check-jsonschema --schemafile schema/report-v1.schema.json schema/golden/*.json schema/golden/signed/*.json schema/golden/benchmarks/*.json

  site:
    name: Site (Seam B)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: site
          bundler-cache: true
      - run: bin/rails db:test:prepare
      - run: bin/rails test
